<!DOCTYPE html>
<html>
<head>
    <title>Persistent Button State</title>
    {{ servers|json_script:"servers-data" }}

    <script>
        const servers = JSON.parse(document.getElementById("servers-data").textContent);

        {% comment %} Recieves information from the server {% endcomment %}
        const websocketProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const serverSocket = new WebSocket(`${websocketProtocol}://${window.location.host}/ws/servers/`);

        serverSocket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "server_added") {
                servers.push(data.server);
                renderServers();
            } else if (data.type === "server_removed") {
                const index = servers.findIndex(server => server.name === data.name);
                if (index !== -1) {
                    servers.splice(index, 1);
                    renderServers();
                }
            } else if (data.type === "server_status") {
                const server = servers.find(server => server.name === data.server.name);
                if (server) {
                    server.is_on = data.server.is_on;
                    renderServers();
                }
            }
        };

        {% comment %} Updates the visuals of the buttons {% endcomment %}
        function updateButton(button, idx) {
            const server = servers[idx];
            if (server) {
                button.textContent = server.name
                if (server.is_on != null) {
                    button.style.backgroundColor = server.is_on ? "#4CAF50" : "#f44336";
                }
                else {
                    button.style.backgroundColor = "#e0f221";
                }
            }
        };

        {% comment %} Makes the button to toggle a server on or off {% endcomment %}
        function makeToggle(idx) {
            const button = document.createElement("button");
            button.onclick = () => power(button, idx);
            updateButton(button, idx);
            return button;
        };

        {% comment %} Makes the reboot button for a server {% endcomment %}
        function makeReboot(idx) {
            const button = document.createElement("button");
            button.textContent = "Reboot Server";
            button.onclick = () => rebt(button, idx);
            return button;
        };

        {% comment %} Makes the delete button for a server {% endcomment %}
        function makeDelete(idx) {
            const button = document.createElement("button");
            button.textContent = "Delete Server";
            button.onclick = () => del(button, idx);
            return button;
        };

        {% comment %} Makes the div each server's buttons are stored it {% endcomment %}
        function makeServerDiv(idx) {
            const div = document.createElement("div")
            div.appendChild(makeToggle(idx));
            div.appendChild(makeReboot(idx));
            div.appendChild(makeDelete(idx));
            return div;
        };

        {% comment %} Goes through on an update and displays the server buttons {% endcomment %}
        function renderServers() {
            const container = document.getElementById("server-buttons");
            container.replaceChildren();
            servers.forEach((server, idx) => {
                container.appendChild(makeServerDiv(idx));
            });
        };

        {% comment %} Handles sending a message for cycling the power on a server {% endcomment %}
        function power(button, idx) {
            button.style.backgroundColor = "#e0f221"

            fetch("{% url 'power' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({"name": servers[idx].name})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    button.textContent = servers[idx].name
                    button.style.backgroundColor = data.enabled ? "#4CAF50" : "#f44336";
                }
            })
            .catch(error => console.error("Error:", error));
        };

        {% comment %} Handles the functionality for adding a server {% endcomment %}
        function add(button) {
            fetch("{% url 'add' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({"name": `test-${servers.length}`, "mac_address": `${servers.length}`, "ip_address": `${servers.length}`})
            })
            .then(response => response.json())
            .catch(error => console.error("Error:", error));
        };

        {% comment %} Handles the functionality for removing a server {% endcomment %}
        function del(button, idx) {
            fetch("{% url 'delete' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({"name": servers[idx].name})
            })
            .then(response => response.json())
            .catch(error => console.error("Error:", error));
        };

        {% comment %} Handles the reboot functionality for a server {% endcomment %}
        function rebt(button, idx) {
            fetch("{% url 'reboot' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({"name": servers[idx].name})
            })
            .then(response => response.json())
            .catch(error => console.error("Error:", error));
        }
    </script>
</head>
<body>
    <h1>Server Dashboard</h1>
    <div id="server-buttons">
        {% for server in servers %}
        <div>
            <button onclick="power(this, {{ forloop.counter0 }})">
                <script>updateButton(document.currentScript.parentElement, {{ forloop.counter0 }});</script>
            </button>
            <button onclick="rebt(this, {{ forloop.counter0 }})">
                Reboot Server
            </button>
            <button onclick="del(this, {{ forloop.counter0 }})">
                Delete Server
            </button>
        </div>
        {% endfor %}
    </div>
    <button onclick="add(this)">Add Server</button>
</body>
</html>
