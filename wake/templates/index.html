<!DOCTYPE html>
<html>
<head>
    <title>Persistent Button State</title>
    {{ servers|json_script:"servers-data" }}
    <script>
        const servers = JSON.parse(document.getElementById("servers-data").textContent);

        function updateButton(button, idx) {
            const server = servers[idx];
            if (server) {
                button.textContent = server.is_on ? "Enabled" : "Disabled";
                button.style.backgroundColor = server.is_on ? "#4CAF50" : "#f44336";
            }
        }

        function desktop(button) {
            button.textContent = "Loading...";
            fetch("{% url 'desktop' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: "bananasoup"
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    button.textContent = data.label;
                    button.style.backgroundColor = data.enabled ? "#4CAF50" : "#f44336";
                }
            })
            .catch(error => console.error("Error:", error));
        }
        
        function other(button) {
            fetch("{% url 'other' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    button.textContent = data.label;
                    button.style.backgroundColor = data.enabled ? "#4CAF50" : "#f44336";
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</head>
<body>
    <h1>Persistent Button Example</h1>
    <button 
        onclick="desktop(this)"
        >
        <script>updateButton(document.currentScript.parentElement, 0);</script>
    </button>
        <button 
        onclick="other(this)"
        >
        <script>updateButton(document.currentScript.parentElement, 1);</script>
    </button>
</body>
</html>
