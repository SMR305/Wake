<!DOCTYPE html>
<html>
<head>
    <title>Persistent Button State</title>
    <script>
        function desktop(button) {
            button.textContent = "Loading...";
            fetch("{% url 'desktop' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    button.textContent = data.label;
                    button.style.backgroundColor = data.enabled ? "#4CAF50" : "#f44336";
                }
            })
            .catch(error => console.error("Error:", error));
        }
        
        function other(button) {
            fetch("{% url 'other' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "ok") {
                    button.textContent = data.label;
                    button.style.backgroundColor = data.enabled ? "#4CAF50" : "#f44336";
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</head>
<body>
    <h1>Persistent Button Example</h1>
    <button 
        onclick="desktop(this)"
        {% if state.button_enabled %}
        style="background-color: #4CAF50;">
        Enabled
        {% else %}
        style="background-color: #f44336;">
        Disabled
        {% endif %}
    </button>
        <button 
        onclick="other(this)"
        {% if state.button_enabled %}
        style="background-color: #4CAF50;">
        Enabled
        {% else %}
        style="background-color: #f44336;">
        Disabled
        {% endif %}
    </button>
</body>
</html>
